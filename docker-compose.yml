services:
  minebot:
    build: .
    image: minebot:latest
    container_name: minebot
    restart: unless-stopped

    # config.json is baked into the image. To tweak settings without rebuilding,
    # uncomment this to mount your edited config from the host:
    # volumes:
    #   - ./config.json:/app/config.json:ro

    # Or override individual values via environment:
    # environment:
    #   MC_PASSWORD: "your-authme-password"

    # Keep logs sane
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
